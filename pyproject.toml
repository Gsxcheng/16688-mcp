[project]
name = "16688-mcp"
version = "0.1.0"
description = "Expose the 16688 Open API (digital card-code shop) as an MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
16688-mcp = "open16688_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open16688_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
