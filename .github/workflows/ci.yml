name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: php --version
      - run: pip install -e '.[test]'
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t 16688-mcp:ci .
      - run: docker run --rm --entrypoint python 16688-mcp:ci -c "import open16688_mcp.server"
